; Restart ETS2 after changing this file. Current-steering forecast assumes constant steering.
[guidance]
enabled=1
endpoint_outline=1
front_swing=1
articulation_indicator=1
trailer_corridor=1
session_latch=1
jackknife_cues=1
; Tractor travel in centimetres. Clamped to 200..800.
prediction_distance_cm=500
; Straight trailer-heading reference corridor length in centimetres. Clamped to 200..800.
corridor_distance_cm=600

[target]
; Experimental manual target route. Ctrl+Shift is required for every action.
; Hold Alt with Ctrl+Shift for coarse positioning (2.0 m / 15 deg).
; Decimal Windows virtual-key codes; disable or remap conflicts with game binds.
enabled=1
; Allow one initial forward pull-up leg when pure reverse cannot reach the bay.
allow_pullup=1
toggle_key=119
confirm_key=13
edit_key=8
clear_key=46
left_key=37
right_key=39
forward_key=38
rearward_key=40
rotate_left_key=33
rotate_right_key=34

[diagnostics]
; Model/world probe tracing is disabled for normal driving.
enabled=0
